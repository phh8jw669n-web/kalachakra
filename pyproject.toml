[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalachakra"
version = "0.1.0"
description = "Autonomous unsupervised ML mapping of the solar system's spatio-temporal geometric waves onto a geodesic model of Earth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Kalachakra" }]
keywords = ["ephemeris", "autoencoder", "fourier-neural-operator", "spherical", "geodesic"]

# numpy for the mathematical core; pyswisseph for real ephemeris data (its
# default Moshier backend needs no external data files).
dependencies = ["numpy>=1.24", "pyswisseph>=2.10"]

[project.scripts]
kalachakra = "kalachakra.cli:main"

[project.optional-dependencies]
# Neural core, training, streaming data pipeline (Phase 3-4 compute).
train = ["torch>=2.2"]
# Density-based manifold clustering (Phase 3 analysis).
cluster = ["hdbscan>=0.8.33", "scikit-learn>=1.3"]
# Tokenized index persistence + query (Phase 3: Parquet / DuckDB / H3).
index = ["pyarrow>=14", "duckdb>=1.0", "h3>=4.0", "pandas>=2.0"]
# Isomorphic transducer topography channel (spherical harmonics).
transducer = ["scipy>=1.10"]
# REST broadcast API (Phase 4 serving).
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
# Everything, for a full workstation build.
all = [
    "torch>=2.2",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.3",
    "pyarrow>=14",
    "duckdb>=1.0",
    "h3>=4.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = ["pytest>=8", "ruff>=0.4"]

# Note: DE441 is not a pip package — it is a set of .se1 data files from the
# Swiss Ephemeris distribution, needed only for the full 10,256-year span
# (the default Moshier backend covers ~1900 BCE - 4650 CE with no files).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
