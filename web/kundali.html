<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kundali Twin — Temporal Search</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #060810; color: #d6dae4;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  @media (max-width: 820px) { #app { grid-template-columns: 1fr; } }
  aside { background: #0b0e17; border-right: 1px solid #1a1f2c; padding: 16px; overflow:auto; }
  main { position: relative; overflow: hidden; }
  h1 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #c8a24a;
    margin: 0 0 2px; }
  .sub { color: #6b7488; font-size: 11px; margin-bottom: 14px; }
  label { display:block; color:#8791a3; font-size:11px; margin:10px 0 3px; letter-spacing:.04em; }
  input { width:100%; background:#0e1220; border:1px solid #232a3b; color:#e7ecf6;
    border-radius:7px; padding:7px 9px; font:inherit; }
  .row2 { display:flex; gap:8px; } .row2 > div { flex:1; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .presets button { background:#131a2a; border:1px solid #26314a; color:#cfe; font:inherit;
    font-size:11px; border-radius:6px; padding:4px 8px; cursor:pointer; }
  .go { width:100%; margin-top:14px; background:#c8a24a; border:none; color:#1a1204;
    font-weight:700; border-radius:8px; padding:10px; cursor:pointer; letter-spacing:.05em; }
  .go:hover { background:#dcb65e; }
  .natal { margin-top:16px; font-size:11px; color:#9aa3b6; line-height:1.7; }
  .natal b { color:#c8a24a; font-weight:600; }
  .natal table { width:100%; border-collapse:collapse; margin-top:6px; }
  .natal td { padding:1px 4px; } .natal td:first-child { color:#7c melody; color:#7c8598; }

  /* tier slider */
  #tierbar { position:absolute; top:0; left:0; right:0; padding:14px 18px 10px;
    background:linear-gradient(#060810ee,#06081000); z-index:5; }
  #tiername { font-size:14px; color:#e7ecf6; letter-spacing:.04em; }
  #tiername b { color:#c8a24a; }
  #tierdesc { color:#6b7488; font-size:11px; margin-top:1px; }
  #tier { width:100%; margin-top:8px; }
  .ticks { display:flex; justify-content:space-between; margin-top:2px; }
  .ticks span { font-size:9px; color:#4c real; color:#495468; width:12.5%; text-align:center; cursor:pointer; }
  .ticks span.has { color:#5f8; } .ticks span.none { color:#734; }
  .ticks span.active { color:#c8a24a; font-weight:700; }

  /* map */
  #map { position:absolute; inset:0; }
  svg { width:100%; height:100%; display:block; }
  .coast { fill:#0e1626; stroke:#25406a; stroke-width:.4; }
  .grid { stroke:#152036; stroke-width:.4; }
  .pin { fill:#c8a24a; stroke:#fff3d0; stroke-width:.4; cursor:pointer; }
  .pin.free { fill:#3f6fb0; }
  #status { position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    background:#0b0e17d0; border:1px solid #1a1f2c; border-radius:8px; padding:8px 14px;
    font-size:12px; color:#aeb6c6; text-align:center; max-width:80%; }
  #status .warn { color:#e6c07b; }
  #tip { position:absolute; pointer-events:none; background:#0b0e17; border:1px solid #26314a;
    border-radius:6px; padding:4px 8px; font-size:11px; color:#e7ecf6; display:none; z-index:9; }
  #results { position:absolute; right:12px; top:96px; width:210px; max-height:70%; overflow:auto;
    background:#0b0e17cc; border:1px solid #1a1f2c; border-radius:8px; padding:8px 10px;
    font-size:11px; z-index:5; }
  #results h2 { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#8791a3;
    margin:0 0 6px; }
  #results div.r { padding:3px 4px; border-bottom:1px solid #141a28; cursor:pointer; }
  #results div.r:hover { background:#131a2a; }
  #results .lon { color:#6b7488; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Kundali Twin</h1>
    <div class="sub">Temporal & geographic astrological search · sidereal (Lahiri)</div>
    <label>Birth date (UTC calendar)</label>
    <input id="date" type="date" value="1990-01-01" />
    <div class="row2">
      <div><label>Time</label><input id="time" type="time" value="12:00" /></div>
      <div><label>TZ (hrs from UT)</label><input id="tz" type="number" step="0.5" value="5.5" /></div>
    </div>
    <div class="row2">
      <div><label>Latitude</label><input id="lat" type="number" step="0.01" value="26.9" /></div>
      <div><label>Longitude</label><input id="lon" type="number" step="0.01" value="75.8" /></div>
    </div>
    <div class="presets">
      <button data-lat="26.9" data-lon="75.8">Rajasthan</button>
      <button data-lat="28.6" data-lon="77.2">Delhi</button>
      <button data-lat="19.1" data-lon="72.9">Mumbai</button>
      <button data-lat="51.5" data-lon="-0.12">London</button>
    </div>
    <button class="go" id="go">Find Twins</button>
    <div class="natal" id="natal"></div>
  </aside>
  <main>
    <div id="tierbar">
      <div id="tiername"><b>Tier 1</b> · Generational Twin</div>
      <div id="tierdesc">Slowest bodies share the same signs.</div>
      <input id="tier" type="range" min="1" max="8" step="1" value="1" />
      <div class="ticks" id="ticks"></div>
    </div>
    <div id="map"></div>
    <div id="results"></div>
    <div id="status">Enter a birth chart and drag the slider.</div>
    <div id="tip"></div>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const API = location.origin;
const TIER_DESC = {
  1: "Slowest bodies (Saturn, Jupiter, Rahu, Ketu) share the same signs.",
  2: "All nine bodies share the same signs (houses ignored).",
  3: "Same 1–12 house sequence — the engine solves the longitude.",
  4: "All signs match and the Ascendant locks to your rising sign.",
  5: "As Tier 4, plus the Moon in the exact same nakshatra.",
  6: "As Tier 5, plus conjunct planets keep the same degree order.",
  7: "Every body within a strict 5° orb of your natal degrees.",
  8: "Identical D9 Navamsa — a city-footprint, exact-minute alignment.",
};
let lastData = null;

// ---- 2D equirectangular map ------------------------------------------------
const W = 720, H = 360;
const X = (lon) => (lon + 180) / 360 * W;
const Y = (lat) => (90 - lat) / 180 * H;
let svg;
function initMap() {
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  $("map").appendChild(svg);
  // graticule
  for (let lo = -180; lo <= 180; lo += 30) line(X(lo), 0, X(lo), H);
  for (let la = -60; la <= 60; la += 30) line(0, Y(la), W, Y(la));
  const eq = document.createElementNS(svg.namespaceURI, "line");
  eq.setAttribute("x1", 0); eq.setAttribute("y1", Y(0)); eq.setAttribute("x2", W);
  eq.setAttribute("y2", Y(0)); eq.setAttribute("class", "grid"); eq.style.stroke = "#20406a";
  svg.appendChild(eq);
  fetch(API + "/api/coastlines.geojson").then(r => r.json()).then(drawCoast).catch(() => {});
}
function line(x1, y1, x2, y2) {
  const l = document.createElementNS(svg.namespaceURI, "line");
  l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2);
  l.setAttribute("y2", y2); l.setAttribute("class", "grid"); svg.appendChild(l);
}
function drawCoast(geo) {
  const rings = [];
  for (const f of (geo.features || [])) {
    const g = f.geometry; if (!g) continue;
    const polys = g.type === "Polygon" ? [g.coordinates]
      : g.type === "MultiPolygon" ? g.coordinates : [];
    for (const poly of polys) for (const ring of poly) rings.push(ring);
  }
  for (const ring of rings) {
    let d = "";
    for (let i = 0; i < ring.length; i++) {
      const [lo, la] = ring[i];
      d += (i ? "L" : "M") + X(lo).toFixed(1) + " " + Y(la).toFixed(1) + " ";
    }
    const p = document.createElementNS(svg.namespaceURI, "path");
    p.setAttribute("d", d + "Z"); p.setAttribute("class", "coast"); svg.appendChild(p);
  }
}
function clearPins() { svg.querySelectorAll(".pin").forEach(e => e.remove()); }
function drawPins(results) {
  clearPins();
  for (const r of results) {
    const c = document.createElementNS(svg.namespaceURI, "circle");
    c.setAttribute("cx", X(r.longitude)); c.setAttribute("cy", Y(r.latitude));
    c.setAttribute("r", 2.6);
    c.setAttribute("class", "pin" + (r.longitude_constrained ? "" : " free"));
    c.addEventListener("mousemove", (e) => showTip(e,
      `${r.date}  ·  lon ${r.longitude}°` + (r.longitude_constrained ? "" : " (any longitude)")));
    c.addEventListener("mouseleave", () => $("tip").style.display = "none");
    svg.appendChild(c);
  }
}
function showTip(e, text) {
  const t = $("tip"); t.textContent = text; t.style.display = "block";
  t.style.left = (e.clientX + 12) + "px"; t.style.top = (e.clientY + 12) + "px";
}

// ---- tier ticks ------------------------------------------------------------
function renderTicks(available, tier) {
  const t = $("ticks"); t.innerHTML = "";
  for (let i = 1; i <= 8; i++) {
    const s = document.createElement("span");
    s.textContent = i;
    let cls = "";
    if (available) cls = available[String(i)] ? "has" : "none";
    if (i === tier) cls += " active";
    s.className = cls.trim();
    s.onclick = () => { $("tier").value = i; onTier(); };
    t.appendChild(s);
  }
}

// ---- search ----------------------------------------------------------------
function body() {
  return {
    date: $("date").value, time: $("time").value, tz_hours: +$("tz").value,
    lat: +$("lat").value, lon: +$("lon").value, tier: +$("tier").value, limit: 400,
  };
}
async function runSearch() {
  $("status").textContent = "Searching the timeline…";
  let data;
  try {
    const res = await fetch(API + "/api/search", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body()) });
    data = await res.json();
    if (data.error) { $("status").innerHTML = `<span class="warn">${data.error}</span>`; return; }
  } catch (e) { $("status").innerHTML = `<span class="warn">Backend unreachable: ${e.message}</span>`; return; }
  lastData = data;
  render(data);
}
function render(data) {
  $("tiername").innerHTML = `<b>Tier ${data.tier}</b> · ${data.tier_name}`;
  $("tierdesc").textContent = TIER_DESC[data.tier];
  renderTicks(data.available, data.tier);
  renderNatal(data.natal);
  drawPins(data.results);
  renderResults(data.results);
  if (data.count === 0) {
    // gentle empty-state: point to the nearest broader tier that has matches
    let lower = null;
    for (let i = data.tier - 1; i >= 1; i--) if (data.available[String(i)]) { lower = i; break; }
    const hint = lower
      ? ` Drag the slider down to <b>Tier ${lower} · ${data.tier_names[lower]}</b> to uncover connections.`
      : " Try a broader tier or a wider database span.";
    $("status").innerHTML = `<span class="warn">No twin found at Tier ${data.tier} — a profoundly rare alignment.</span>${hint}`;
  } else {
    $("status").textContent =
      `${data.count} historical ${data.count === 1 ? "match" : "matches"} · Tier ${data.tier} · ${data.tier_name}`;
  }
}
function renderNatal(n) {
  if (!n) return;
  let rows = "";
  for (const [k, b] of Object.entries(n.bodies)) {
    rows += `<tr><td>${k}</td><td>${b.sign} ${b.deg}°</td></tr>`;
  }
  $("natal").innerHTML =
    `<b>Ascendant:</b> ${n.ascendant}<table>${rows}</table>`;
}
function renderResults(results) {
  const el = $("results");
  if (!results.length) { el.innerHTML = ""; return; }
  let h = `<h2>${results.length} results</h2>`;
  for (const r of results.slice(0, 60)) {
    h += `<div class="r" data-lon="${r.longitude}" data-lat="${r.latitude}">${r.date}` +
         ` <span class="lon">${r.longitude}°</span></div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll(".r").forEach(d => d.onclick = () => {
    svg.querySelectorAll(".pin").forEach(p => p.setAttribute("r", 2.6));
  });
}

// ---- events ----------------------------------------------------------------
let tierTimer = null;
function onTier() {
  $("tiername").innerHTML = `<b>Tier ${$("tier").value}</b>`;
  $("tierdesc").textContent = TIER_DESC[+$("tier").value];
  renderTicks(lastData ? lastData.available : null, +$("tier").value);
  clearTimeout(tierTimer);
  tierTimer = setTimeout(runSearch, 120);
}
$("tier").addEventListener("input", onTier);
$("go").onclick = runSearch;
document.querySelectorAll(".presets button").forEach(b => b.onclick = () => {
  $("lat").value = b.dataset.lat; $("lon").value = b.dataset.lon; runSearch();
});

initMap();
renderTicks(null, 1);
runSearch();
</script>
</body>
</html>
