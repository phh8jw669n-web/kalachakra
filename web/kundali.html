<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kundali Twin — Temporal Search</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #060810; color: #d6dae4;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  @media (max-width: 860px) { #app { grid-template-columns: 1fr; } }
  aside { background: #0b0e17; border-right: 1px solid #1a1f2c; padding: 16px; overflow:auto; }
  main { position: relative; overflow: hidden; }
  h1 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #c8a24a; margin: 0 0 2px; }
  .sub { color: #6b7488; font-size: 11px; margin-bottom: 14px; }
  label { display:block; color:#8791a3; font-size:11px; margin:10px 0 3px; letter-spacing:.04em; }
  input { width:100%; background:#0e1220; border:1px solid #232a3b; color:#e7ecf6;
    border-radius:7px; padding:7px 9px; font:inherit; }
  .row2 { display:flex; gap:8px; } .row2 > div { flex:1; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .presets button { background:#131a2a; border:1px solid #26314a; color:#cfe; font:inherit;
    font-size:11px; border-radius:6px; padding:4px 8px; cursor:pointer; }
  .go { width:100%; margin-top:14px; background:#c8a24a; border:none; color:#1a1204;
    font-weight:700; border-radius:8px; padding:10px; cursor:pointer; letter-spacing:.05em; }
  .go:hover { background:#dcb65e; }

  .section { margin-top:16px; border-top:1px solid #161c2a; padding-top:12px; }
  .seg { display:flex; gap:0; margin-top:6px; border:1px solid #26314a; border-radius:7px; overflow:hidden; }
  .seg button { flex:1; background:#0e1220; border:none; color:#8791a3; font:inherit; font-size:11px;
    padding:6px; cursor:pointer; } .seg button.on { background:#1c2740; color:#e7ecf6; }
  .quick { display:flex; flex-wrap:wrap; gap:5px; margin:10px 0 8px; }
  .quick button { background:#131a2a; border:1px solid #26314a; color:#aeb6c6; font:inherit; font-size:10px;
    border-radius:6px; padding:3px 7px; cursor:pointer; } .quick button:hover { color:#fff; }
  .tether { display:flex; align-items:center; gap:8px; padding:3px 2px; font-size:12px; cursor:pointer;
    border-radius:5px; }
  .tether:hover { background:#101726; }
  .tether input { width:auto; }
  .tether .nm { width:66px; color:#c8a24a; text-transform:capitalize; }
  .tether .pl { color:#9aa3b6; flex:1; }
  .tether .hs { color:#6b7488; font-size:10px; }
  .tether.off { opacity:.34; }
  .ascline { margin-top:10px; font-size:11px; color:#9aa3b6; } .ascline b { color:#c8a24a; }
  .hmatrix { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
  .hcell { border:1px solid #232a3b; border-radius:6px; padding:6px 4px; text-align:center; cursor:pointer;
    background:#0e1220; font-size:11px; }
  .hcell .hn { color:#8791a3; font-size:10px; } .hcell .hb { color:#c8a24a; font-size:9px; min-height:10px; }
  .hcell.occ { border-color:#3a4d6b; } .hcell.on { background:#1c2740; border-color:#c8a24a; }
  .hcell.empty { opacity:.4; cursor:default; }

  #tierbar { position:absolute; top:0; left:0; right:0; padding:14px 18px 10px;
    background:linear-gradient(#060810ee,#06081000); z-index:5; }
  #tiername { font-size:14px; color:#e7ecf6; letter-spacing:.04em; } #tiername b { color:#c8a24a; }
  #tierdesc { color:#6b7488; font-size:11px; margin-top:1px; }
  #tier { width:100%; margin-top:8px; }
  .ticks { display:flex; justify-content:space-between; margin-top:2px; }
  .ticks span { font-size:9px; color:#495468; width:12.5%; text-align:center; cursor:pointer; }
  .ticks span.has { color:#5f8; } .ticks span.none { color:#a55; } .ticks span.active { color:#c8a24a; font-weight:700; }

  #map { position:absolute; inset:0; background:#070c16; } svg { width:100%; height:100%; display:block; }
  .coast { fill:#1b2c49; stroke:#5b83bd; stroke-width:.6; }
  .grid { stroke:#233350; stroke-width:.5; }
  .locus { fill:#5db4ec; stroke:none; opacity:.7; }
  .freezone { fill:#3f6fb0; opacity:.12; }
  .pin { fill:#c8a24a; stroke:#fff3d0; stroke-width:.4; cursor:pointer; transition:opacity .25s; }
  .pin.free { fill:#3f6fb0; }
  #status { position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    background:#0b0e17d0; border:1px solid #1a1f2c; border-radius:8px; padding:8px 14px;
    font-size:12px; color:#aeb6c6; text-align:center; max-width:80%; } #status .warn { color:#e6c07b; }
  #tip { position:absolute; pointer-events:none; background:#0b0e17; border:1px solid #26314a;
    border-radius:6px; padding:4px 8px; font-size:11px; color:#e7ecf6; display:none; z-index:9; }
  #results { position:absolute; right:12px; top:96px; width:246px; max-height:70%; overflow:auto;
    background:#0b0e17cc; border:1px solid #1a1f2c; border-radius:8px; padding:8px 10px; font-size:11px; z-index:5; }
  #results h2 { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#8791a3; margin:0 0 6px; }
  #results div.r { padding:4px 4px; border-bottom:1px solid #141a28; }
  #results .r .top { display:flex; justify-content:space-between; align-items:baseline; }
  #results .dt { color:#d6dae4; } #results .tm { color:#7f93b5; }
  #results .sc { color:#5f8; } #results .lon { color:#c8a24a; } #results .free { color:#5aa0d6; }
  #results .lt { color:#6b7488; font-size:10px; }
  #results::-webkit-scrollbar { width:7px; } #results::-webkit-scrollbar-thumb { background:#24314b; border-radius:4px; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Kundali Twin</h1>
    <div class="sub">Temporal & geographic astrological search · sidereal (Lahiri)</div>
    <label>Birth date (UTC calendar)</label>
    <input id="date" type="date" value="1990-01-01" />
    <div class="row2">
      <div><label>Time</label><input id="time" type="time" value="12:00" /></div>
      <div><label>TZ (hrs from UT)</label><input id="tz" type="number" step="0.5" value="5.5" /></div>
    </div>
    <div class="row2">
      <div><label>Latitude</label><input id="lat" type="number" step="0.01" value="26.9" /></div>
      <div><label>Longitude</label><input id="lon" type="number" step="0.01" value="75.8" /></div>
    </div>
    <div class="presets">
      <button data-lat="26.9" data-lon="75.8">Rajasthan</button>
      <button data-lat="28.6" data-lon="77.2">Delhi</button>
      <button data-lat="19.1" data-lon="72.9">Mumbai</button>
      <button data-lat="51.5" data-lon="-0.12">London</button>
    </div>
    <label style="margin-top:12px">Search date range (optional)</label>
    <div class="row2">
      <div><input id="fromYear" type="number" step="1" placeholder="from yr" /></div>
      <div><input id="toYear" type="number" step="1" placeholder="to yr" /></div>
    </div>
    <div class="sub" id="coverage" style="margin:4px 0 0">Whole database.</div>
    <button class="go" id="go">Find Twins</button>

    <div class="section">
      <label style="margin:0">Constraint filter</label>
      <div class="seg">
        <button id="mPlanets" class="on">By Planets</button>
        <button id="mHouses">By Houses</button>
      </div>
      <div id="planetsPane">
        <div class="quick">
          <button data-q="all">All</button>
          <button data-q="outer">Outer Core</button>
          <button data-q="lum">Luminaries</button>
          <button data-q="reset">Reset</button>
        </div>
        <div id="tethers"></div>
      </div>
      <div id="housesPane" style="display:none">
        <div class="sub" style="margin:8px 0 0">Lock the houses that must match (occupied outlined).</div>
        <div class="hmatrix" id="hmatrix"></div>
      </div>
      <div class="ascline" id="asc"></div>
    </div>
  </aside>
  <main>
    <div id="tierbar">
      <div id="tiername"><b>Tier 1</b> · Generational Twin</div>
      <div id="tierdesc">Slowest bodies share the same signs.</div>
      <input id="tier" type="range" min="1" max="8" step="1" value="1" />
      <div class="ticks" id="ticks"></div>
    </div>
    <div id="map"></div>
    <div id="results"></div>
    <div id="status">Enter a birth chart and drag the slider.</div>
    <div id="tip"></div>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const API = location.origin;
const BODY_NAMES = ["sun","moon","mars","mercury","jupiter","venus","saturn","rahu","ketu"];
const QUICK = { all: BODY_NAMES, outer: ["jupiter","saturn","rahu","ketu"], lum: ["sun","moon"] };
const TIER_DESC = {
  1:"Slowest bodies (Saturn, Jupiter, Rahu, Ketu) share the same signs.",
  2:"All nine bodies share the same signs (houses ignored).",
  3:"Same 1–12 house sequence — the engine solves the longitude.",
  4:"All signs match and the Ascendant locks to your rising sign.",
  5:"As Tier 4, plus the Moon in the exact same nakshatra.",
  6:"As Tier 5, plus conjunct planets keep the same degree order.",
  7:"Every body within a strict 5° orb of your natal degrees.",
  8:"Identical D9 Navamsa — a city-footprint, exact-minute alignment.",
};
let lastData = null;
let filterMode = "planets";                 // 'planets' | 'houses'
let activePlanets = new Set(BODY_NAMES);    // planetary tethers
let activeHouses = null;                     // Set<int> or null (init from natal)

// ---- 2D equirectangular map ------------------------------------------------
const W = 720, H = 360;
const X = (lon) => (lon + 180) / 360 * W, Y = (lat) => (90 - lat) / 180 * H;
let svg;
function initMap() {
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); $("map").appendChild(svg);
  for (let lo=-180; lo<=180; lo+=30) line(X(lo),0,X(lo),H);
  for (let la=-60; la<=60; la+=30) line(0,Y(la),W,Y(la));
  fetch(API + "/api/coastlines.geojson").then(r=>r.json()).then(drawCoast).catch(()=>{});
}
function line(x1,y1,x2,y2){ const l=document.createElementNS(svg.namespaceURI,"line");
  l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
  l.setAttribute("class","grid"); svg.appendChild(l); }
function drawCoast(geo){ const rings=[];
  for(const f of (geo.features||[])){ const g=f.geometry; if(!g) continue;
    const polys=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];
    for(const poly of polys) for(const ring of poly) rings.push(ring); }
  for(const ring of rings){ let d="";
    for(let i=0;i<ring.length;i++){ const [lo,la]=ring[i]; d+=(i?"L":"M")+X(lo).toFixed(1)+" "+Y(la).toFixed(1)+" "; }
    const p=document.createElementNS(svg.namespaceURI,"path"); p.setAttribute("d",d+"Z");
    p.setAttribute("class","coast"); svg.appendChild(p); } }
function clearPins(){ svg.querySelectorAll(".pin,.locus,.freezone").forEach(e=>e.remove()); }
function dot(cx,cy,r,cls){ const c=document.createElementNS(svg.namespaceURI,"circle");
  c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",r);
  c.setAttribute("class",cls); return c; }
function drawPins(data){ clearPins();
  // Sign tiers are geocentric — the same signs hold everywhere on Earth on that
  // date. There is no meaningful pin location, so tint the whole map instead.
  if (data.location_free) {
    const rect=document.createElementNS(svg.namespaceURI,"rect");
    rect.setAttribute("x",0); rect.setAttribute("y",0);
    rect.setAttribute("width",W); rect.setAttribute("height",H);
    rect.setAttribute("class","freezone"); svg.appendChild(rect); return;
  }
  // House tiers: the Ascendant depends on latitude, so each date's valid
  // birthplaces trace a lat/lon curve. Draw the locus (faint) + the primary point.
  for(const r of data.results){
    if (r.globe_points) for(const p of r.globe_points)
      svg.appendChild(dot(X(p.lon),Y(p.lat),1.8,"locus"));
    const c=dot(X(r.longitude),Y(r.latitude),2.6,"pin");
    c.style.cursor="pointer";
    c.addEventListener("mousemove",(e)=>showTip(e,
      `${r.date} ${r.time_utc} · lon ${r.longitude}° · ${r.local_time||""} · ${r.total_matched}/9`));
    c.addEventListener("mouseleave",()=>$("tip").style.display="none"); svg.appendChild(c);
  } }
function showTip(e,t){ const el=$("tip"); el.textContent=t; el.style.display="block";
  el.style.left=(e.clientX+12)+"px"; el.style.top=(e.clientY+12)+"px"; }

// ---- tethers + houses ------------------------------------------------------
function renderTethers(natal) {
  const el = $("tethers"); el.innerHTML = "";
  for (const nm of BODY_NAMES) {
    const b = natal.bodies[nm]; const on = activePlanets.has(nm);
    const row = document.createElement("label");
    row.className = "tether" + (on ? "" : " off");
    row.innerHTML = `<input type="checkbox" ${on ? "checked" : ""}>` +
      `<span class="nm">${nm}</span><span class="pl">${b.sign} ${b.deg}°</span>` +
      `<span class="hs">H${b.house}</span>`;
    row.querySelector("input").addEventListener("change", (e) => {
      if (e.target.checked) activePlanets.add(nm); else activePlanets.delete(nm);
      row.classList.toggle("off", !e.target.checked);
      debounced();
    });
    el.appendChild(row);
  }
}
function renderHouses(natal) {
  const el = $("hmatrix"); el.innerHTML = "";
  const occ = natal.houses || {};
  if (activeHouses === null) activeHouses = new Set(Object.keys(occ).map(Number));
  for (let h = 1; h <= 12; h++) {
    const residents = occ[String(h)] || [];
    const isOcc = residents.length > 0;
    const on = activeHouses.has(h) && isOcc;
    const cell = document.createElement("div");
    cell.className = "hcell" + (isOcc ? " occ" : " empty") + (on ? " on" : "");
    cell.innerHTML = `<div class="hn">H${h}</div><div class="hb">` +
      residents.map(r => r.slice(0, 2)).join(" ") + `</div>`;
    if (isOcc) cell.addEventListener("click", () => {
      if (activeHouses.has(h)) activeHouses.delete(h); else activeHouses.add(h);
      cell.classList.toggle("on"); debounced();
    });
    el.appendChild(cell);
  }
}
function applyQuick(q) {
  if (q === "reset") { activePlanets = new Set(BODY_NAMES); }
  else { activePlanets = new Set(QUICK[q]); }
  if (lastData) renderTethers(lastData.natal);
  debounced();
}
function setMode(mode) {
  filterMode = mode;
  $("mPlanets").classList.toggle("on", mode === "planets");
  $("mHouses").classList.toggle("on", mode === "houses");
  $("planetsPane").style.display = mode === "planets" ? "" : "none";
  $("housesPane").style.display = mode === "houses" ? "" : "none";
  debounced();
}

// ---- tier ticks ------------------------------------------------------------
function renderTicks(available, tier) {
  const t = $("ticks"); t.innerHTML = "";
  for (let i = 1; i <= 8; i++) {
    const s = document.createElement("span"); s.textContent = i;
    let cls = available ? (available[String(i)] ? "has" : "none") : "";
    if (i === tier) cls += " active";
    s.className = cls.trim();
    s.onclick = () => { $("tier").value = i; onTier(); };
    t.appendChild(s);
  }
}

// ---- search ----------------------------------------------------------------
function body() {
  const b = { date:$("date").value, time:$("time").value, tz_hours:+$("tz").value,
    lat:+$("lat").value, lon:+$("lon").value, tier:+$("tier").value, limit:1000 };
  const fy = $("fromYear").value, ty = $("toYear").value;
  if (fy !== "") b.start_year = +fy;
  if (ty !== "") b.end_year = +ty;
  if (filterMode === "houses" && activeHouses) b.active_houses = [...activeHouses];
  else b.active_planets = [...activePlanets];
  return b;
}
let dq = null;
function debounced() { clearTimeout(dq); dq = setTimeout(runSearch, 300); }
async function runSearch() {
  $("status").textContent = "Searching the timeline…";
  let data;
  try {
    const res = await fetch(API + "/api/search", { method:"POST",
      headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body()) });
    data = await res.json();
    if (data.error) { $("status").innerHTML = `<span class="warn">${data.error}</span>`; return; }
  } catch (e) { $("status").innerHTML = `<span class="warn">Backend unreachable: ${e.message}</span>`; return; }
  lastData = data; render(data);
}
function render(data) {
  $("tiername").innerHTML = `<b>Tier ${data.tier}</b> · ${data.tier_name}`;
  $("tierdesc").textContent = TIER_DESC[data.tier];
  renderTicks(data.available, data.tier);
  renderTethers(data.natal);
  if (filterMode === "houses") renderHouses(data.natal);
  $("asc").innerHTML = `<b>Ascendant:</b> ${data.natal.ascendant} · ` +
    `<b>${data.active_constraint_count}/9</b> constraints (score ${data.match_score})`;
  if (data.coverage) $("coverage").textContent =
    `Database ${data.coverage.start_year}–${data.coverage.end_year}. Leave blank for all.`;
  drawPins(data); renderResults(data.results);
  const geo = data.location_free
    ? ` · <span class="warn">location-free</span> (same signs worldwide on each date)`
    : ` · birthplaces trace the blue curve across latitudes`;
  if (data.count === 0) {
    let lower = null;
    for (let i = data.tier - 1; i >= 1; i--) if (data.available[String(i)]) { lower = i; break; }
    const hint = lower
      ? ` Drag the slider down to <b>Tier ${lower} · ${data.tier_names[lower]}</b>, or uncheck a fast-moving body to relax the match.`
      : " Uncheck a body, widen the year range, or widen the database span.";
    $("status").innerHTML = `<span class="warn">No twin at Tier ${data.tier} with ${data.active_constraint_count}/9 constraints.</span>${hint}`;
  } else {
    $("status").innerHTML = `${data.count} ${data.count===1?"match":"matches"} · Tier ${data.tier} · ` +
      `${data.tier_name} · <b>${data.active_constraint_count}/9</b> planets locked${geo}`;
  }
}
function renderResults(results) {
  const el = $("results");
  if (!results.length) { el.innerHTML = ""; return; }
  let h = `<h2>${results.length} results</h2>`;
  for (const r of results.slice(0, 1000)) {
    const place = r.longitude_constrained
      ? `<span class="lon">${r.longitude}°</span>`
      : `<span class="free">any place</span>`;
    const lt = r.longitude_constrained ? `<span class="lt"> · ${r.local_time}</span>` : "";
    h += `<div class="r">` +
         `<div class="top"><span class="dt">${r.date}</span><span class="tm">${r.time_utc}</span></div>` +
         `<div class="top"><span class="sc">${r.total_matched}/9 twins</span>` +
         `<span>${place}${lt}</span></div></div>`;
  }
  el.innerHTML = h;
}

// ---- events ----------------------------------------------------------------
let tierTimer = null;
function onTier() {
  $("tiername").innerHTML = `<b>Tier ${$("tier").value}</b>`;
  $("tierdesc").textContent = TIER_DESC[+$("tier").value];
  renderTicks(lastData ? lastData.available : null, +$("tier").value);
  clearTimeout(tierTimer); tierTimer = setTimeout(runSearch, 120);
}
function resetForNewChart() { activePlanets = new Set(BODY_NAMES); activeHouses = null; runSearch(); }
$("tier").addEventListener("input", onTier);
$("go").onclick = resetForNewChart;
["date","time","tz","lat","lon"].forEach(id => $(id).addEventListener("change", resetForNewChart));
["fromYear","toYear"].forEach(id => $(id).addEventListener("input", debounced));
document.querySelectorAll(".presets button").forEach(b => b.onclick = () => {
  $("lat").value = b.dataset.lat; $("lon").value = b.dataset.lon; resetForNewChart(); });
document.querySelectorAll(".quick button").forEach(b => b.onclick = () => applyQuick(b.dataset.q));
$("mPlanets").onclick = () => setMode("planets");
$("mHouses").onclick = () => setMode("houses");

initMap(); renderTicks(null, 1); runSearch();
</script>
</body>
</html>
