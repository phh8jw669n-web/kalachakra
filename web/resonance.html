<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kalachakra — Geo-Resonance Globe</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #050508; overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #cfd3dc; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .panel { position: fixed; background: rgba(10,12,18,0.74); border: 1px solid #1b1f2a;
    border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); font-size: 12px; }
  h1 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #9aa3b2; margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; gap: 6px; margin: 6px 0; align-items: center; }
  .row label { width: 40px; color: #7c8598; }
  input, button { font: inherit; }
  input { background: #0b0e15; border: 1px solid #232838; color: #e8ecf4;
    border-radius: 6px; padding: 5px 7px; flex: 1; box-sizing: border-box; min-width: 0; }
  input[type=range] { padding: 0; }
  button { background: #14304a; border: 1px solid #244a6e; color: #dfe8f5; cursor: pointer;
    border-radius: 6px; padding: 6px 9px; }
  button:hover { background: #1b3f60; }
  button.primary { background: #b8860b; border-color: #d4a017; color: #1a1204; font-weight: 700; }
  button.primary:hover { background: #d4a017; }
  button:disabled { opacity: 0.4; cursor: default; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .presets button { padding: 4px 8px; font-size: 11px; }
  .hint { color: #5c6577; font-size: 11px; margin-top: 8px; line-height: 1.5; }

  #controls { top: 58px; left: 14px; width: 236px; }
  #legend { top: 58px; right: 14px; width: 168px; }
  #legend .bar { height: 10px; border-radius: 5px; margin: 8px 0 4px;
    background: linear-gradient(90deg,#001122,#0A2540 22%,#111116 40%,#050508 55%,#FF8C00 78%,#FFD700 90%,#FFFFFF); }
  #legend .lab { display: flex; justify-content: space-between; color: #6b7488; font-size: 10px; }

  #clock { top: 14px; left: 50%; transform: translateX(-50%); text-align: center; padding: 8px 18px; }
  #clock .k { color: #6b7488; font-size: 9px; letter-spacing: 0.22em; }
  #clock .v { color: #ffd98a; font-size: 20px; letter-spacing: 0.06em; margin-top: 2px;
    font-variant-numeric: tabular-nums; text-shadow: 0 0 14px rgba(255,190,90,0.35); }
  #anchorlock { color: #7bd0ff; font-size: 10px; letter-spacing: 0.12em; margin-top: 5px;
    display: none; text-shadow: 0 0 10px rgba(90,180,255,0.4); }
  #loading { color: #ffd98a; font-size: 11px; letter-spacing: 0.2em; margin-top: 5px;
    display: none; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.32; } 50% { opacity: 1; } }
  #transport.busy { opacity: 0.45; pointer-events: none; }

  #timeline { bottom: 14px; left: 50%; transform: translateX(-50%); width: min(760px, 94vw); }
  #timeline .grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  #timeline .f { display: flex; flex-direction: column; gap: 3px; }
  #timeline .f span { color: #7c8598; font-size: 10px; }
  #transport { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  #scrub { flex: 1; }
  #status { color: #6b7488; font-size: 11px; min-width: 108px; text-align: right; }
  #err { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    color: #e0a3a3; font-size: 11px; max-width: 70vw; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>

<div id="clock" class="panel">
  <div class="k">CURRENTLY PROJECTING</div>
  <div class="v" id="clock-v">— — —</div>
  <div id="anchorlock"></div>
  <div id="loading">[ COMPUTING FIELD TENSORS... ]</div>
</div>

<div id="controls" class="panel">
  <h1>Anchor</h1>
  <div class="row"><label>Lat</label><input id="lat" type="number" step="0.1" value="26.9" /></div>
  <div class="row"><label>Lon</label><input id="lon" type="number" step="0.1" value="75.7" /></div>
  <div class="presets">
    <button data-lat="26.9" data-lon="75.7">Rajasthan</button>
    <button data-lat="51.5" data-lon="-0.12">London</button>
    <button data-lat="35.7" data-lon="139.7">Tokyo</button>
    <button data-lat="-33.9" data-lon="18.4">Cape Town</button>
    <button data-lat="40.7" data-lon="-74.0">New York</button>
  </div>
  <div class="hint">Click the globe to set an anchor. Drag to orbit, scroll to zoom.</div>
  <div class="row" style="margin-top:8px"><label style="width:auto">Relief</label>
    <input id="elev" type="range" min="0" max="0.6" step="0.01" value="0.26" /></div>
  <div class="row"><label style="width:auto">Map</label>
    <input id="mapop" type="range" min="0" max="1" step="0.02" value="0.9" /></div>
</div>

<div id="legend" class="panel">
  <div class="k" style="color:#9aa3b2;letter-spacing:0.14em;text-transform:uppercase;font-size:11px">Cosine resonance</div>
  <div class="bar"></div>
  <div class="lab"><span>−1 shear</span><span>0</span><span>+1</span></div>
  <div class="hint" id="legend-stats" style="margin-top:10px">node — · ‖z‖ — · cos [—, —]</div>
</div>

<div id="timeline" class="panel">
  <div class="grid">
    <div class="f"><span>Start (UTC)</span><input id="start" type="datetime-local" /></div>
    <div class="f"><span>End (UTC)</span><input id="end" type="datetime-local" /></div>
    <div class="f"><span>Step (hours) · fps</span>
      <div style="display:flex;gap:6px"><input id="stepH" type="number" step="1" value="24" style="width:64px" />
        <input id="fps" type="range" min="0.5" max="30" step="0.5" value="6" /></div></div>
  </div>
  <div id="transport">
    <button id="play" class="primary">▶ Play</button>
    <button id="pause" disabled>⏸ Pause</button>
    <button id="stepb">⟩ Step</button>
    <input id="scrub" type="range" min="0" max="0" step="1" value="0" />
    <div id="status">idle</div>
  </div>
</div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const API = location.origin;
const $ = (id) => document.getElementById(id);
const err = (m) => { $('err').textContent = m || ''; };
const dec = new TextDecoder();

// ---- scene ----------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050508, 1);
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100);
// The backend builds geometry with +Z as the North Pole (z = sin(lat)); align the
// camera's up-axis to Z so OrbitControls spins around the poles (natural equatorial
// rotation) instead of tumbling. Start in the equatorial plane looking at 0N.
camera.up.set(0, 0, 1);
camera.position.set(2.7, 1.5, 0.65);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1.25; controls.maxDistance = 8;
controls.autoRotate = true; controls.autoRotateSpeed = 0.28;

scene.add(new THREE.AmbientLight(0x8899bb, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(3, 2, 4); scene.add(key);

// ---- Earth context sphere (our lat/lon convention: z = sin(lat)) ----------
function buildEarth() {
  const stacks = 90, slices = 180, r = 0.985;
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= stacks; i++) {
    const lat = (-90 + 180 * i / stacks) * Math.PI / 180;
    for (let j = 0; j <= slices; j++) {
      const lon = (-180 + 360 * j / slices) * Math.PI / 180;
      pos.push(r * Math.cos(lat) * Math.cos(lon), r * Math.cos(lat) * Math.sin(lon), r * Math.sin(lat));
      uv.push(j / slices, i / stacks);            // equirectangular u=lon, v=lat
    }
  }
  const w = slices + 1;
  for (let i = 0; i < stacks; i++) for (let j = 0; j < slices; j++) {
    const a = i * w + j, b = a + 1, c = a + w, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  // canvas texture: graticule (always aligned), earth image overlaid if it loads.
  const cw = 2048, ch = 1024, cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const cx = cv.getContext('2d');
  const paintGrid = () => {
    cx.strokeStyle = 'rgba(90,120,160,0.28)'; cx.lineWidth = 1;
    for (let lo = -180; lo <= 180; lo += 30) { const x = (lo + 180) / 360 * cw;
      cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, ch); cx.stroke(); }
    for (let la = -90; la <= 90; la += 30) { const y = (90 - la) / 180 * ch;
      cx.beginPath(); cx.moveTo(0, y); cx.lineTo(cw, y); cx.stroke(); }
    cx.strokeStyle = 'rgba(120,150,190,0.5)';
    cx.beginPath(); cx.moveTo(0, ch / 2); cx.lineTo(cw, ch / 2); cx.stroke();
  };
  cx.fillStyle = '#0a0f18'; cx.fillRect(0, 0, cw, ch); paintGrid();
  const tex = new THREE.CanvasTexture(cv);
  // depthWrite:true makes the Earth a solid physical blocker so the rear-hemisphere
  // data waves are depth-culled instead of bleeding through onto the front.
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.9,
    depthWrite: true });
  const img = new Image(); img.crossOrigin = 'anonymous';
  img.onload = () => {
    cx.globalAlpha = 0.85; cx.drawImage(img, 0, 0, cw, ch); cx.globalAlpha = 1; paintGrid();
    tex.needsUpdate = true;
  };
  img.onerror = () => {};                          // graticule-only fallback
  img.src = 'https://unpkg.com/three-globe/example/img/earth-dark.jpg';
  const mesh = new THREE.Mesh(g, mat);
  return { mesh, mat, tex };
}
const earth = buildEarth(); earth.mesh.renderOrder = 0; scene.add(earth.mesh);
$('mapop').addEventListener('input', e => earth.mat.opacity = +e.target.value);

// invisible pick sphere (radius 1, our convention matches the earth mesh)
const pick = new THREE.Mesh(new THREE.SphereGeometry(1.0, 48, 32),
  new THREE.MeshBasicMaterial({ visible: false }));
scene.add(pick);

// ---- data mesh (solid, displaced, lit) ------------------------------------
const uniforms = {
  uElevation: { value: 0.26 },
  uLightDir: { value: new THREE.Vector3(0.4, 0.55, 0.85).normalize() },
  uTween: { value: 0.0 },                        // 0..1 blend from current frame to next
};
const material = new THREE.ShaderMaterial({
  uniforms, side: THREE.FrontSide,               // cull the rear hemisphere (outward-wound tris)
  transparent: true, depthWrite: false,          // non-resonant faces reveal the Earth beneath
  vertexShader: `
    attribute float aMagCurrent; attribute float aSimCurrent;
    attribute float aMagNext;    attribute float aSimNext;
    uniform float uElevation; uniform float uTween;
    varying float vSimA; varying float vSimB; varying vec3 vView;
    void main(){
      vSimA = aSimCurrent; vSimB = aSimNext;
      float mag = mix(aMagCurrent, aMagNext, uTween);   // smooth relief between frames
      vec3 disp = position * (1.0 + mag * uElevation);
      vec4 mv = modelViewMatrix * vec4(disp, 1.0);
      vView = mv.xyz;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    precision highp float;
    varying float vSimA; varying float vSimB; varying vec3 vView;
    uniform vec3 uLightDir; uniform float uTween;
    vec3 palette(float s){
      vec3 abyssDeep=vec3(0.0,0.066,0.133), abyss=vec3(0.039,0.145,0.251);
      vec3 charLo=vec3(0.020,0.020,0.031),  charHi=vec3(0.067,0.067,0.086);
      vec3 amber=vec3(1.0,0.549,0.0),       gold=vec3(1.0,0.843,0.0);
      vec3 warm=vec3(1.0,0.973,0.906),      white=vec3(1.0);
      if(s<0.0)   return mix(abyssDeep, abyss, clamp(s+1.0,0.0,1.0));
      if(s<0.70)  return mix(charHi, charLo, s/0.70);
      if(s<0.90)  return mix(amber, gold, (s-0.70)/0.20);
      return mix(warm, white, clamp((s-0.90)/0.10,0.0,1.0));
    }
    void main(){
      float vSim = mix(vSimA, vSimB, uTween);               // smooth colour between frames
      vec3 n = normalize(cross(dFdx(vView), dFdy(vView)));   // flat per-face normal
      if(n.z < 0.0) n = -n;
      float diff = max(dot(n, normalize(uLightDir)), 0.0);
      vec3 base = palette(vSim);
      vec3 col = base * (0.28 + 0.95 * diff);
      col += base * smoothstep(0.82, 1.0, vSim) * 0.7;       // glow high resonance
      // Neutral/ocean zones (vSim < 0.70) -> semi-transparent dark glass (0.15);
      // resonant zones (vSim >= 0.70) -> opaque glowing waves (0.90).
      float alpha = mix(0.15, 0.90, smoothstep(0.68, 0.72, vSim));
      gl_FragColor = vec4(col, alpha);
    }`,
});
$('elev').addEventListener('input', e => uniforms.uElevation.value = +e.target.value);

let dataMesh = null, N = 0, geo = null;
let aMagC = null, aSimC = null, aMagN = null, aSimN = null;

async function loadTopology(){
  const res = await fetch(API + '/api/topology');
  if(!res.ok) throw new Error('topology ' + res.status);
  const buf = await res.arrayBuffer();
  const dv = new DataView(buf);
  N = dv.getUint32(0, true);
  const nTris = dv.getUint32(4, true);
  const verts = new Float32Array(buf, 8, N * 3);
  const indices = new Uint32Array(buf, 8 + N * 12, nTris * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(verts.slice(), 3));
  aMagC = new Float32Array(N); aSimC = new Float32Array(N);
  aMagN = new Float32Array(N); aSimN = new Float32Array(N);
  g.setAttribute('aMagCurrent', new THREE.BufferAttribute(aMagC, 1));
  g.setAttribute('aSimCurrent', new THREE.BufferAttribute(aSimC, 1));
  g.setAttribute('aMagNext', new THREE.BufferAttribute(aMagN, 1));
  g.setAttribute('aSimNext', new THREE.BufferAttribute(aSimN, 1));
  g.setIndex(new THREE.BufferAttribute(indices.slice(), 1));
  geo = g;
  dataMesh = new THREE.Mesh(g, material);
  dataMesh.frustumCulled = false;
  dataMesh.renderOrder = 2;                 // drawn after the Earth + coastlines
  scene.add(dataMesh);
  $('status').textContent = N.toLocaleString() + ' nodes · ' + nTris.toLocaleString() + ' tris';
}

// ---- coastline overlay (crisp continent outlines, our xyz frame) ----------
let coastLines = null;
async function loadCoastlines(){
  try {
    const res = await fetch(API + '/api/coastlines');
    if(!res.ok) throw new Error('coastlines ' + res.status);
    const buf = await res.arrayBuffer();
    if(buf.byteLength < 4) return;
    const nSeg = new DataView(buf).getUint32(0, true);
    if(nSeg === 0) return;                  // no dataset -> graticule stands in
    const verts = new Float32Array(buf, 4, nSeg * 6);   // pairs: [x0,y0,z0, x1,y1,z1]
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(verts.slice(), 3));
    const mat = new THREE.LineBasicMaterial({ color: 0x6f93c4, transparent: true, opacity: 0.95 });
    coastLines = new THREE.LineSegments(g, mat);
    coastLines.renderOrder = 1;             // between the Earth sphere and the data mesh
    scene.add(coastLines);
  } catch(e){ /* graticule fallback already on the Earth sphere */ }
}

const cleanTs = (s) => s.replace(/\.0 UTC.*/, ' UTC');
function markDirty(){
  geo.attributes.aMagCurrent.needsUpdate = geo.attributes.aSimCurrent.needsUpdate = true;
  geo.attributes.aMagNext.needsUpdate = geo.attributes.aSimNext.needsUpdate = true;
}
function updateLegend(sims){
  let mn = Infinity, mx = -Infinity;
  for(const s of sims){ if(s < mn) mn = s; if(s > mx) mx = s; }
  $('legend-stats').textContent =
    `node ${anchorNode ?? '—'} · cos [${mn.toFixed(2)}, ${mx.toFixed(2)}]`;
}
// Static single frame: current == next, no tween.
function applyStatic(mags, sims){
  if(!aMagC) return;
  aMagC.set(mags); aSimC.set(sims); aMagN.set(mags); aSimN.set(sims);
  markDirty(); uniforms.uTween.value = 0; updateLegend(sims);
}
// Load a (current, next) pair for interpolated playback; loop tweens between them.
let curIndex = -1;
function setFramePair(fi){
  if(!aMagC || !frames.length) return;
  const last = frames.length - 1;
  const a = frames[Math.min(fi, last)], b = frames[Math.min(fi + 1, last)];
  aMagC.set(a.mags); aSimC.set(a.sims); aMagN.set(b.mags); aSimN.set(b.sims);
  markDirty(); updateLegend(a.sims);
  $('clock-v').textContent = cleanTs(a.ts);
  curIndex = fi;
}

// ---- HUD: anchor lock (#1) + computing state (#4) -------------------------
function showAnchorLock(dateStr){
  const el = $('anchorlock'); el.textContent = 'ANCHOR LOCKED TO: ' + dateStr;
  el.style.display = 'block';
}
function hideAnchorLock(){ $('anchorlock').style.display = 'none'; }
function showComputing(){ $('loading').style.display = 'block'; $('transport').classList.add('busy'); }
function hideComputing(){ $('loading').style.display = 'none'; $('transport').classList.remove('busy'); }
const fmtStartDisplay = (v) => v ? v.replace('T', ' ') + ' UTC' : 'start date';

// ---- single-frame anchor (instant, no animation) --------------------------
let anchorNode = null;
async function resonateStatic(lat, lon){
  err(''); stopStream(); setPlaying(false);
  frames = []; streamDone = false; curIndex = -1;
  hideAnchorLock(); hideComputing();
  try {
    const res = await fetch(API + '/api/resonance', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ anchor_lat: lat, anchor_lon: lon }) });
    if(!res.ok) throw new Error('resonance ' + res.status);
    const buf = new Float32Array(await res.arrayBuffer());
    anchorNode = res.headers.get('X-Node-Id');
    applyStatic(buf.subarray(0, N), buf.subarray(N, 2 * N));
    $('clock-v').textContent = '— static frame —';
    const rl = res.headers.get('X-Anchor-Lat'), ro = res.headers.get('X-Anchor-Lon');
    if(rl) $('lat').value = (+rl).toFixed(1); if(ro) $('lon').value = (+ro).toFixed(1);
  } catch(e){ err(String(e.message || e)); }
}

// ---- temporal stream + playback ------------------------------------------
let frames = [], cursor = 0, playing = false, streamAbort = null, streamDone = false;

function isoUTC(el){                     // datetime-local (assumed UTC) -> ISO Z
  return el.value ? el.value + ':00Z' : null;
}
function concat(a, b){ const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; }

async function startStream(){
  if(!dataMesh){ err('mesh not loaded yet'); return; }
  stopStream(); frames = []; cursor = 0; curIndex = -1; streamDone = false;
  $('scrub').max = 0; $('scrub').value = 0;
  const body = { anchor_lat: +$('lat').value, anchor_lon: +$('lon').value,
    start_date: isoUTC($('start')), end_date: isoUTC($('end')), step_hours: +$('stepH').value };
  streamAbort = new AbortController();
  showAnchorLock(fmtStartDisplay($('start').value));   // provisional; refined from header
  showComputing();                                     // pulsing while the backend batches
  $('status').textContent = 'computing…'; setPlaying(true);
  let res;
  try { res = await fetch(API + '/api/stream_resonance', { method: 'POST', signal: streamAbort.signal,
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  catch(e){ hideComputing(); err('stream failed: ' + e.message); setPlaying(false); return; }
  const total = +(res.headers.get('X-N-Frames') || 0);
  anchorNode = res.headers.get('X-Node-Id');
  const ad = res.headers.get('X-Anchor-Date'); if(ad) showAnchorLock(cleanTs(ad));
  const reader = res.body.getReader();
  let carry = new Uint8Array(0);
  try {
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      carry = concat(carry, value);
      let off = 0;
      while(carry.byteLength - off >= 4){
        const dv = new DataView(carry.buffer, carry.byteOffset + off, 4);
        const flen = dv.getUint32(0, true);
        if(carry.byteLength - off - 4 < flen) break;
        const fb = carry.buffer.slice(carry.byteOffset + off + 4, carry.byteOffset + off + 4 + flen);
        const fdv = new DataView(fb);
        const tsLen = fdv.getUint32(0, true);
        const ts = dec.decode(new Uint8Array(fb, 4, tsLen));
        const magOff = 4 + tsLen;
        const mags = new Float32Array(fb.slice(magOff, magOff + N * 4));
        const sims = new Float32Array(fb.slice(magOff + N * 4, magOff + 2 * N * 4));
        frames.push({ ts, mags, sims });
        off += 4 + flen;
      }
      carry = carry.slice(off);
      if(frames.length >= 1) hideComputing();          // first frame in -> drop the loader
      $('scrub').max = Math.max(frames.length - 1, 0);
      $('status').textContent = `buffered ${frames.length}/${total || '?'}`;
    }
    streamDone = true;
    hideComputing();
    $('status').textContent = `ready ${frames.length} frames`;
  } catch(e){
    hideComputing();
    if(e.name !== 'AbortError') err('stream read error: ' + e.message);
  }
}
function stopStream(){ if(streamAbort){ streamAbort.abort(); streamAbort = null; } }

function setPlaying(v){ playing = v; $('play').disabled = v; $('pause').disabled = !v; }
$('play').onclick = () => {
  if(frames.length === 0 || (!streamDone && cursor >= frames.length - 1)) startStream();
  else setPlaying(true);
};
$('pause').onclick = () => setPlaying(false);
$('stepb').onclick = () => { setPlaying(false); if(frames.length){
  cursor = Math.min(Math.floor(cursor) + 1, frames.length - 1);
  setFramePair(Math.floor(cursor)); uniforms.uTween.value = 0; $('scrub').value = Math.floor(cursor); } };
$('scrub').addEventListener('input', e => { setPlaying(false); if(frames.length){
  cursor = Math.min(+e.target.value, frames.length - 1);
  setFramePair(Math.floor(cursor)); uniforms.uTween.value = 0; } });

// anchor inputs / presets / click
document.querySelectorAll('.presets button').forEach(b => b.onclick = () => {
  $('lat').value = b.dataset.lat; $('lon').value = b.dataset.lon; resonateStatic(+$('lat').value, +$('lon').value);
});
[$('lat'), $('lon')].forEach(el => el.addEventListener('change', () => resonateStatic(+$('lat').value, +$('lon').value)));

const ray = new THREE.Raycaster(); let downXY = null;
renderer.domElement.addEventListener('pointerdown', e => downXY = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if(!downXY) return; const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]); downXY = null;
  if(moved > 6) return;
  const m = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(m, camera);
  const hit = ray.intersectObject(pick, false)[0]; if(!hit) return;
  const p = hit.point.clone().normalize();
  const lat = THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(p.z, -1, 1)));
  const lon = THREE.MathUtils.radToDeg(Math.atan2(p.y, p.x));
  $('lat').value = lat.toFixed(1); $('lon').value = lon.toFixed(1);
  controls.autoRotate = false; resonateStatic(lat, lon);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- render + playback loop ----------------------------------------------
let last = performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if(playing && frames.length){
    const lastI = frames.length - 1;
    cursor += (+$('fps').value) * dt;
    if(cursor >= lastI){
      if(streamDone) cursor = 0;                  // loop when fully buffered
      else cursor = lastI;                        // hold at buffer edge
    }
    const fi = Math.floor(cursor);
    if(fi !== curIndex) setFramePair(fi);         // swap current/next only on frame change
    uniforms.uTween.value = cursor - fi;          // buttery interpolation within the step
    $('scrub').value = fi;
  }
  controls.update();
  renderer.render(scene, camera);
})(last);

// ---- boot -----------------------------------------------------------------
(function initDates(){
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:00`;
  const s = new Date(); const e = new Date(s.getTime() + 30 * 864e5);
  $('start').value = fmt(s); $('end').value = fmt(e);
})();
loadCoastlines();
loadTopology()
  .then(() => resonateStatic(+$('lat').value, +$('lon').value))
  .catch(e => err('Could not reach backend at ' + API + ' — is serve_resonance.py running? (' + e.message + ')'));
</script>
</body>
